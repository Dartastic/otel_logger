name: otel_logger
description: >-
  OpenTelemetry instrumentation for `package:logger`. A `LogOutput` that
  mirrors every log event into the OTel logs pipeline, carrying `trace_id`
  and `span_id` from the active span.
version: 0.2.0-wip
repository: https://github.com/dartastic/otel_logger
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.12
  dartastic_opentelemetry_api: ^1.0.0-rc.1
  logger: ^2.0.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
